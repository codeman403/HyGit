[project]
name = "hygit-backend"
version = "0.1.0"
description = "HyGit Backend — Wikipedia for any GitHub Repo, powered by HydraDB"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "openai>=1.55.0",
    "structlog>=24.4.0",
    "PyGithub>=2.5.0",
    "GitPython>=3.1.43",
    "python-multipart>=0.0.17",
    # PostgreSQL async driver
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    # Redis async client
    "redis[asyncio]>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
