services:
  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  - type: web
    name: hygit-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install fastapi "uvicorn[standard]" pydantic pydantic-settings httpx python-dotenv openai structlog PyGithub python-multipart asyncpg "sqlalchemy[asyncio]" "redis[asyncio]"
    startCommand: python -m uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: HYDRA_DB_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://hygit.vercel.app
      - key: DEBUG
        value: "false"
      - key: CACHE_TTL_SECONDS
        value: "3600"
      - key: PYTHONPATH
        value: .

  # ── Frontend (Next.js) ───────────────────────────────────────────────────────
  - type: web
    name: hygit-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false  # Set to your backend URL: https://hygit-backend.onrender.com
